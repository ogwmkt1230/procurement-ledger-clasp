name: deploy

# main にマージされたら、テストを通したうえで clasp push で台帳のスクリプトに反映する
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "Secret CLASPRC_JSON is not set"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Check manifest
        run: |
          grep -q '"Asia/Tokyo"' src/appsscript.json
          grep -q '"serviceId": "drive"' src/appsscript.json
      - name: clasp push
        run: npx --yes @google/clasp@3 push --force
